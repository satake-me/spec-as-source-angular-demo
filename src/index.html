<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularTempApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .app-startup-loading {
      --startup-loading-fade-ms: 280;
      min-height: 100dvh;
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.92), rgba(244, 248, 255, 0.72) 52%, rgba(236, 240, 248, 0.84)),
        #f4f7fc;
      color: #202124;
      font-family: Roboto, system-ui, sans-serif;
      transition: opacity calc(var(--startup-loading-fade-ms) * 1ms) ease;
    }

    .app-startup-loading--exit {
      opacity: 0;
    }

    .app-startup-loading__card {
      width: min(29rem, calc(100vw - 2rem));
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 1.2rem;
      background: color-mix(in srgb, white 75%, rgba(255, 255, 255, 0.2));
      padding: 1.35rem;
      box-sizing: border-box;
      display: grid;
      gap: 0.75rem;
      justify-items: center;
      text-align: center;
      box-shadow: 0 16px 48px rgba(34, 45, 70, 0.2);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 1;
    }

    .app-startup-loading__skeleton {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: clamp(11rem, 20vw, 16rem) minmax(0, 1fr);
      grid-template-rows: clamp(3.3rem, 8vh, 4rem) 1fr;
      gap: clamp(0.6rem, 1.3vw, 1rem);
      padding: clamp(0.7rem, 2vw, 1.2rem);
      filter: blur(10px);
      opacity: 0.78;
      pointer-events: none;
    }

    .app-startup-loading__skeleton-sidebar,
    .app-startup-loading__skeleton-topbar,
    .app-startup-loading__skeleton-card {
      border-radius: 0.9rem;
      background: linear-gradient(150deg, rgba(205, 214, 227, 0.52), rgba(181, 189, 203, 0.44));
    }

    .app-startup-loading__skeleton-sidebar {
      grid-row: 1 / 3;
    }

    .app-startup-loading__skeleton-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(6.4rem, 1fr);
      gap: 0.7rem;
    }

    .app-startup-loading__spinner {
      width: 3.4rem;
      aspect-ratio: 1;
      border-radius: 999px;
      position: relative;
      background:
        conic-gradient(
          from 0deg,
          #ff4d4d,
          #ff8d3f,
          #ffe15d,
          #77df84,
          #4fc8ff,
          #7182ff,
          #d675f9,
          #ff4d4d
        );
      will-change: transform;
      box-shadow: 0 0 0 rgba(113, 130, 255, 0.3);
      animation:
        app-startup-spin 1300ms linear infinite,
        app-startup-bob 2200ms ease-in-out infinite,
        app-startup-glow 1900ms ease-in-out infinite;
    }

    .app-startup-loading__spinner::before {
      content: '';
      position: absolute;
      top: -0.4rem;
      left: 50%;
      width: 0.2rem;
      height: 1rem;
      margin-left: -0.1rem;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 123, 102, 0.96));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.45),
        0 0 10px rgba(255, 123, 102, 0.42);
      z-index: 2;
    }

    .app-startup-loading__spinner::after {
      content: '';
      position: absolute;
      inset: 0.35rem;
      border-radius: inherit;
      background: color-mix(in srgb, white 82%, rgba(244, 247, 253, 0.6));
      z-index: 1;
    }

    .app-startup-loading__title {
      margin: 0;
      font-size: 1.03rem;
      font-weight: 600;
      color: #263246;
    }

    .app-startup-loading__copy {
      margin: 0;
      color: #5f6f89;
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.35;
      max-width: 32ch;
    }

    @keyframes app-startup-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes app-startup-bob {
      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -0.12rem;
      }
    }

    @keyframes app-startup-glow {
      0%,
      100% {
        box-shadow: 0 0 0 rgba(113, 130, 255, 0.2);
      }

      50% {
        box-shadow: 0 0 20px rgba(113, 130, 255, 0.4);
      }
    }

    @media (max-width: 900px) {
      .app-startup-loading__skeleton {
        grid-template-columns: minmax(9rem, 28vw) minmax(0, 1fr);
      }

      .app-startup-loading__skeleton-content {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-startup-loading {
        transition-duration: 0ms;
      }

      .app-startup-loading__spinner {
        animation: app-startup-spin 1300ms linear infinite;
        background: linear-gradient(135deg, #ff7161, #f9ce58, #62d8a2, #67a7ff, #be73f7);
      }

      .app-startup-loading__spinner::before {
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.52),
          0 0 14px rgba(255, 123, 102, 0.68);
      }

      .app-startup-loading__skeleton {
        filter: blur(6px);
      }
    }
  </style>
</head>
<body>
  <div id="app-startup-loading" class="app-startup-loading" role="status" aria-live="polite">
    <div class="app-startup-loading__skeleton" aria-hidden="true">
      <div class="app-startup-loading__skeleton-sidebar"></div>
      <div class="app-startup-loading__skeleton-topbar"></div>
      <div class="app-startup-loading__skeleton-content">
        <div class="app-startup-loading__skeleton-card"></div>
        <div class="app-startup-loading__skeleton-card"></div>
        <div class="app-startup-loading__skeleton-card"></div>
        <div class="app-startup-loading__skeleton-card"></div>
      </div>
    </div>

    <div class="app-startup-loading__card">
      <div class="app-startup-loading__spinner" aria-hidden="true"></div>
      <p class="app-startup-loading__title">Loading workspace</p>
      <p class="app-startup-loading__copy">Starting application shell and runtime config.</p>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
